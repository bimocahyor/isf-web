services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18.6 (latest stable minor as of 2026-09-21)
  # Using an explicit minor-version tag for reproducibility.
  # Update to 18.7-alpine (or later) when a new minor is published.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: isf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isf_db
      POSTGRES_USER: isf_user
      POSTGRES_PASSWORD: isf_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isf_user -d isf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible local object storage
  # Web console: http://localhost:9001 (user: isf_minio_user / isf_minio_password)
  # API endpoint: http://localhost:9000
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: isf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: isf_minio_user
      MINIO_ROOT_PASSWORD: isf_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MinIO bucket initialization
  # Creates the required buckets on first start.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: isf_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 isf_minio_user isf_minio_password;
        mc mb --ignore-existing local/isf-private-docs;
        mc mb --ignore-existing local/isf-public-assets;
        mc anonymous set download local/isf-public-assets;
        echo 'MinIO buckets initialized.';
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # Mailpit — local email testing
  # SMTP: localhost:1025 (no auth required)
  # Web UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: isf_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true

# ---------------------------------------------------------------------------
# Named volumes — Docker manages these; they persist across container restarts.
# NEVER commit the Docker volume contents to Git.
# Data lives outside the project directory.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  minio_data:
